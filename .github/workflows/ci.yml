name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas: ["pandas>=2.2,<3", "pandas>=3,<4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install "${{ matrix.pandas }}" matplotlib numpy seaborn scipy pytest
      - name: Repository checks
        run: python scripts/check_repo.py
      - name: Tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
      - name: Chart smoke test
        env:
          MPLBACKEND: Agg
        run: python scripts/smoke_charts.py charts
      - name: Keep the smoke-test charts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-charts-${{ strategy.job-index }}
          path: charts/
